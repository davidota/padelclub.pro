# ===================================================================
# Docker Compose - Entorno INTEGRACIÓN
# ===================================================================
# Uso:
# docker-compose -f docker-compose.integration.yml up -d
# ===================================================================

version: '3.8'

services:
  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: padelclub-postgres-integration
    environment:
      POSTGRES_DB: ${DB_NAME:-padelclub_integration}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-integration:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - padelclub-network
    restart: always

  # Redis
  redis:
    image: redis:7-alpine
    container_name: padelclub-redis-integration
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data-integration:/data
    networks:
      - padelclub-network
    restart: always

  # Aplicación
  app:
    image: padelclub-pro:${VERSION:-latest}
    container_name: padelclub-app-integration
    environment:
      - SPRING_PROFILES_ACTIVE=integration
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME:-padelclub_integration}
      - DB_USER=${DB_USER:-admin}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - FIREBASE_CREDENTIALS_PATH=${FIREBASE_CREDENTIALS_PATH}
      - JAVA_OPTS=-Xms512m -Xmx1g
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./logs:/app/logs
      - ./credentials:/app/credentials:ro
    networks:
      - padelclub-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: padelclub-nginx-integration
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/integration.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - padelclub-network
    restart: always

volumes:
  postgres-data-integration:
    driver: local
  redis-data-integration:
    driver: local

networks:
  padelclub-network:
    driver: bridge
