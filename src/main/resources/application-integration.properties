# ===================================================================
# ENTORNO INTEGRACIÓN - Testing en la nube
# ===================================================================

# Server
server.port=8080

# Vaadin
vaadin.launch-browser=false
vaadin.allowed-packages=com.vaadin,org.vaadin,com.padellevel
vaadin.production-mode=true

# Database - PostgreSQL en RDS/Cloud SQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:integration-db.padelclub.pro}:5432/${DB_NAME:padelclub_integration}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# SQL Init
spring.sql.init.mode=never

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Logging - Moderado
logging.level.root=INFO
logging.level.com.padellevel=DEBUG
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.atmosphere=WARN

# Log file
logging.file.name=/var/log/padelclub/integration.log
logging.file.max-size=10MB
logging.file.max-history=30

# Security
spring.security.password.encoder=org.springframework.security.crypto.bcrypt.BCryptPasswordEncoder

# SSL
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE_PATH:/etc/padelclub/keystore.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# SERVICIOS EXTERNOS - Test Keys
# ===================================================================

# Stripe (Test Keys)
stripe.api.key=${STRIPE_SECRET_KEY}
stripe.public.key=${STRIPE_PUBLIC_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
stripe.enabled=true

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=https://integration.padelclub.pro/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=profile,email
google.oauth.enabled=true

# SendGrid
sendgrid.api.key=${SENDGRID_API_KEY}
sendgrid.from.email=noreply-integration@padelclub.pro
sendgrid.from.name=Padel Club Integration
sendgrid.enabled=true

# Firebase
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH}
firebase.enabled=true

# Google Calendar API
google.calendar.credentials.path=${GOOGLE_CALENDAR_CREDENTIALS_PATH}
google.calendar.enabled=true

# Redis
spring.redis.host=${REDIS_HOST:integration-redis.padelclub.pro}
spring.redis.port=6379
spring.redis.password=${REDIS_PASSWORD}
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.enabled=true

# ===================================================================
# FEATURES FLAGS
# ===================================================================
app.features.payments.enabled=true
app.features.notifications.enabled=true
app.features.google-auth.enabled=true
app.features.chat.enabled=true
app.features.statistics.enabled=true
app.features.gamification.enabled=true

# ===================================================================
# APLICACIÓN
# ===================================================================
app.name=Padel Club Pro
app.version=@project.version@
app.environment=integration
app.base-url=https://integration.padelclub.pro

# Data initialization
app.data.init.enabled=true
app.data.init.generate-test-data=true
app.data.init.num-test-players=50

# CORS
app.cors.allowed-origins=https://integration.padelclub.pro
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*

# Rate Limiting
app.rate-limit.enabled=true
app.rate-limit.requests-per-minute=100

# Monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
