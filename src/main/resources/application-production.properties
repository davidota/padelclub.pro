# ===================================================================
# ENTORNO PRODUCCIÓN - Live environment
# ===================================================================

# Server
server.port=8080

# Vaadin
vaadin.launch-browser=false
vaadin.allowed-packages=com.vaadin,org.vaadin,com.padellevel
vaadin.production-mode=true
vaadin.whitelisted-packages=com.padellevel

# Database - PostgreSQL con replicación
spring.datasource.url=jdbc:postgresql://${DB_HOST:prod-db.padelclub.pro}:5432/${DB_NAME:padelclub_prod}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# SQL Init
spring.sql.init.mode=never

# Connection Pool - Optimizado para producción
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# Logging - Solo errores y warnings
logging.level.root=WARN
logging.level.com.padellevel=INFO
logging.level.org.springframework.boot=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.atmosphere=ERROR

# Log file
logging.file.name=/var/log/padelclub/production.log
logging.file.max-size=50MB
logging.file.max-history=90
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Security
spring.security.password.encoder=org.springframework.security.crypto.bcrypt.BCryptPasswordEncoder

# SSL - Obligatorio
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE_PATH:/etc/padelclub/keystore.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=padelclub
server.ssl.protocol=TLS
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# SERVICIOS EXTERNOS - LIVE KEYS
# ===================================================================

# Stripe (LIVE Keys)
stripe.api.key=${STRIPE_LIVE_SECRET_KEY}
stripe.public.key=${STRIPE_LIVE_PUBLIC_KEY}
stripe.webhook.secret=${STRIPE_LIVE_WEBHOOK_SECRET}
stripe.enabled=true

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=https://padelclub.pro/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=profile,email
google.oauth.enabled=true

# SendGrid
sendgrid.api.key=${SENDGRID_API_KEY}
sendgrid.from.email=noreply@padelclub.pro
sendgrid.from.name=Padel Club Pro
sendgrid.enabled=true

# Firebase
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH}
firebase.enabled=true

# Google Calendar API
google.calendar.credentials.path=${GOOGLE_CALENDAR_CREDENTIALS_PATH}
google.calendar.enabled=true

# Redis Cluster
spring.redis.cluster.nodes=${REDIS_CLUSTER_NODES}
spring.redis.password=${REDIS_PASSWORD}
spring.cache.type=redis
spring.cache.redis.time-to-live=7200000
spring.cache.enabled=true

# ===================================================================
# FEATURES FLAGS
# ===================================================================
app.features.payments.enabled=true
app.features.notifications.enabled=true
app.features.google-auth.enabled=true
app.features.chat.enabled=true
app.features.statistics.enabled=true
app.features.gamification.enabled=true

# ===================================================================
# APLICACIÓN
# ===================================================================
app.name=Padel Club Pro
app.version=@project.version@
app.environment=production
app.base-url=https://padelclub.pro
app.admin-url=https://admin.padelclub.pro
app.api-url=https://api.padelclub.pro

# Data initialization - DESHABILITADO en producción
app.data.init.enabled=false
app.data.init.generate-test-data=false

# CORS - Estricto
app.cors.allowed-origins=https://padelclub.pro,https://admin.padelclub.pro,https://api.padelclub.pro
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,X-Requested-With
app.cors.max-age=3600

# Rate Limiting - Agresivo
app.rate-limit.enabled=true
app.rate-limit.requests-per-minute=60
app.rate-limit.burst-capacity=100

# Session
server.servlet.session.timeout=60m
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.domain=.padelclub.pro

# Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# HTTP/2
server.http2.enabled=true

# Monitoring - Solo endpoints necesarios
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# Health Check
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Backup - Cada 6 horas
app.backup.enabled=true
app.backup.schedule=0 0 */6 * * ?
app.backup.retention-days=90
app.backup.s3.bucket=${BACKUP_S3_BUCKET}
app.backup.s3.region=${BACKUP_S3_REGION}

# CDN
app.cdn.enabled=true
app.cdn.url=https://cdn.padelclub.pro

# Storage
app.storage.type=s3
app.storage.s3.bucket=${STORAGE_S3_BUCKET}
app.storage.s3.region=${STORAGE_S3_REGION}

# Alerting
app.alerting.enabled=true
app.alerting.slack.webhook=${SLACK_WEBHOOK_URL}
app.alerting.pagerduty.key=${PAGERDUTY_API_KEY}

# Security Headers
server.servlet.session.tracking-modes=cookie
security.headers.frame-options=DENY
security.headers.content-type-options=nosniff
security.headers.xss-protection=1; mode=block
security.headers.hsts=max-age=31536000; includeSubDomains

# Error handling
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
