# ===================================================================
# ENTORNO LOCAL - Desarrollo en portátil
# ===================================================================

# Server
server.port=8080

# Vaadin
vaadin.launch-browser=true
vaadin.allowed-packages=com.vaadin,org.vaadin,com.padellevel

# Database - HSQLDB file-based para desarrollo local
spring.datasource.url=jdbc:hsqldb:file:./data/mydatabase
spring.datasource.driverClassName=org.hsqldb.jdbc.JDBCDriver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.HSQLDialect

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# HSQLDB Console
spring.hsqldb.console.enabled=true
spring.hsqldb.console.path=/hsqldb-console

# SQL Init
spring.sql.init.mode=never

# Logging - Detallado para desarrollo
logging.level.root=INFO
logging.level.com.padellevel=DEBUG
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.atmosphere=WARN

# Security
spring.security.password.encoder=org.springframework.security.crypto.bcrypt.BCryptPasswordEncoder

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# SERVICIOS EXTERNOS - Modo Mock/Test
# ===================================================================

# Stripe (Test Keys)
stripe.api.key=sk_test_YOUR_TEST_KEY_HERE
stripe.public.key=pk_test_YOUR_PUBLIC_KEY_HERE
stripe.webhook.secret=whsec_YOUR_WEBHOOK_SECRET_HERE
stripe.enabled=false

# Google OAuth2 (Dev credentials)
spring.security.oauth2.client.registration.google.client-id=YOUR_DEV_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_DEV_CLIENT_SECRET
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=profile,email
google.oauth.enabled=false

# SendGrid (Mock mode)
sendgrid.api.key=SG.mock_key
sendgrid.from.email=noreply@localhost
sendgrid.from.name=Padel Club Local
sendgrid.enabled=false

# Firebase (Dev project)
firebase.credentials.path=classpath:firebase-dev-credentials.json
firebase.enabled=false

# Google Calendar API
google.calendar.credentials.path=classpath:google-calendar-dev-credentials.json
google.calendar.enabled=false

# Redis (Optional for local development)
spring.redis.host=localhost
spring.redis.port=6379
spring.cache.type=simple
spring.cache.enabled=false

# ===================================================================
# FEATURES FLAGS - Todo habilitado en local
# ===================================================================
app.features.payments.enabled=true
app.features.notifications.enabled=true
app.features.google-auth.enabled=true
app.features.chat.enabled=true
app.features.statistics.enabled=true
app.features.gamification.enabled=true

# ===================================================================
# APLICACIÓN
# ===================================================================
app.name=Padel Club Pro
app.version=@project.version@
app.environment=local
app.base-url=http://localhost:8080

# Data initialization
app.data.init.enabled=true
app.data.init.generate-test-data=true
app.data.init.num-test-players=20

# Debug
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
