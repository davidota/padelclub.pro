# ===================================================================
# CONFIGURACIÓN BASE - Padel Club Pro
# ===================================================================
# Esta configuración es compartida por todos los entornos.
# Las configuraciones específicas están en:
# - application-local.properties
# - application-integration.properties
# - application-uat.properties
# - application-production.properties
#
# Para ejecutar con un perfil específico:
# ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
# o configurar la variable: SPRING_PROFILES_ACTIVE=local
# ===================================================================

# Active Profile (default: local)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Application
spring.application.name=padelclub-pro
spring.main.banner-mode=console

# Server
server.port=${PORT:8080}
server.shutdown=graceful

# Mustache
spring.mustache.check-template-location=false

# Vaadin - Configuración base
vaadin.allowed-packages=com.vaadin,org.vaadin,com.padellevel
logging.level.org.atmosphere=warn

# JPA - Configuración base
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# Security
spring.security.password.encoder=org.springframework.security.crypto.bcrypt.BCryptPasswordEncoder

# Encoding
spring.mandatory-file-encoding=UTF-8
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ===================================================================
# NOTA: Configuraciones específicas de entorno en archivos separados
# ===================================================================