# Configuración para tests
spring.application.name=padel-test

# H2 en memoria para tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate para tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging reducido para tests
logging.level.root=WARN
logging.level.com.padellevel=INFO
logging.level.org.springframework.security=WARN

# Desactivar Vaadin en tests
vaadin.launch-browser=false
vaadin.whitelisted-packages=com.padellevel

# OAuth2 desactivado para tests
spring.security.oauth2.client.registration.google.enabled=false

# Stripe desactivado para tests
stripe.api.key=sk_test_fake_key_for_testing
