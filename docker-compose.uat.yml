# ===================================================================
# Docker Compose - Entorno UAT
# ===================================================================
# Uso:
# docker-compose -f docker-compose.uat.yml up -d
# ===================================================================

version: '3.8'

services:
  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: padelclub-postgres-uat
    environment:
      POSTGRES_DB: ${DB_NAME:-padelclub_uat}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-uat:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - padelclub-network
    restart: always
    command: postgres -c shared_preload_libraries=pg_stat_statements

  # Redis
  redis:
    image: redis:7-alpine
    container_name: padelclub-redis-uat
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data-uat:/data
    networks:
      - padelclub-network
    restart: always

  # Aplicación
  app:
    image: padelclub-pro:${VERSION:-latest}
    container_name: padelclub-app-uat
    environment:
      - SPRING_PROFILES_ACTIVE=uat
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME:-padelclub_uat}
      - DB_USER=${DB_USER:-admin}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - FIREBASE_CREDENTIALS_PATH=${FIREBASE_CREDENTIALS_PATH}
      - JAVA_OPTS=-Xms1g -Xmx2g
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./logs:/app/logs
      - ./credentials:/app/credentials:ro
    networks:
      - padelclub-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: padelclub-nginx-uat
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/uat.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - padelclub-network
    restart: always

  # Prometheus (monitoreo)
  prometheus:
    image: prom/prometheus:latest
    container_name: padelclub-prometheus-uat
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data-uat:/prometheus
    networks:
      - padelclub-network
    restart: always

  # Grafana (visualización)
  grafana:
    image: grafana/grafana:latest
    container_name: padelclub-grafana-uat
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data-uat:/var/lib/grafana
    networks:
      - padelclub-network
    restart: always

volumes:
  postgres-data-uat:
    driver: local
  redis-data-uat:
    driver: local
  prometheus-data-uat:
    driver: local
  grafana-data-uat:
    driver: local

networks:
  padelclub-network:
    driver: bridge
